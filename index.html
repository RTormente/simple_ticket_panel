<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
        />
        <meta name="author" content="Rodrigo Tormente" />
        <meta name="description" content="Painel de senha simples, com apresentação e controle na mesma tela." />

        <link rel="stylesheet" href="./assets/css/index.css" />

        <script type="module" src="./assets/js/main.js" defer></script>

        <link rel="icon" type="image/x-icon" href="./assets/img/logo_orig.jfif" />
        <title>Painel de Senha</title>
    </head>

    <body>
        <main id="ticketContainer">
            <div class="label">COMUM:</div>
            <div class="ticketDisplay" id="ticketNormal">000</div>
            <div class="label">PREFERENCIAL:</div>
            <div class="ticketDisplay" id="ticketPreferential">P000</div>
        </main>

        <div id="settingsPanel" class="floatingIcon settingsPanel">
            <button
                title="Abrir/Fechar Menu Configurações"
                aria-label="Abrir/Fechar Menu Configurações"
                id="iconSettingsPanel"
                class="fa-solid fa-gear"
                data-panel-toggle
            ></button>

            <form id="formSettingsPanel" class="hidden">
                <fieldset>
                    <legend>Senhas:</legend>
                    <label>
                        Comum:
                        <input type="number" name="inNormalTicket" id="inNormalTicket" min="0" max="999" />
                    </label>
                    <label>
                        Preferencial:
                        <input type="number" id="inPreferTicket" name="inPreferTicket" min="0" max="999" />
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Bipe:</legend>
                    <label>
                        Duração:
                        <input type="range" name="inToneDuration" id="inToneDuration" min="50" max="1000" step="50" />
                    </label>
                    <label>
                        Quantidade:
                        <input type="number" name="inToneCount" id="inToneCount" min="1" max="4" />
                    </label>
                    <div id="toneSequenceControls"></div>
                    <button id="btnTestBipper" type="button" class="playTest">Testar Bipe</button>
                </fieldset>

                <fieldset>
                    <legend>Voz:</legend>
                    <label>
                        Tipo:
                        <select name="inVoiceList" id="inVoiceList">
                            <option value="mute">Mudo</option>
                        </select>
                    </label>
                    <label>
                        Velocidade:
                        <span id="inVoiceRateValue" class="toneControlValue"></span>
                        <input type="range" name="inVoiceRate" id="inVoiceRate" min="0.5" max="2" step="0.1" />
                    </label>
                    <label>
                        Tom:
                        <span id="inVoicePitchValue" class="toneControlValue"></span>
                        <input type="range" name="inVoicePitch" id="inVoicePitch" min="0" max="2" step="0.1" />
                    </label>
                    <button id="btnTestVoice" type="button" class="playTest">Testar Voz</button>
                </fieldset>

                <button class="resetDefault" type="reset" value="Salvar">Restaurar Padrões</button>
            </form>
        </div>

        <div id="infoPanel" class="floatingIcon infoPanel">
            <button
                title="Abrir/Fechar Menu Informações"
                aria-label="Abrir/Fechar Menu Informações"
                id="iconInfoPanel"
                class="fa-solid fa-circle-info"
                data-panel-toggle
            ></button>

            <div class="hidden">
                <h3>Teclas de atalho</h3>

                <ul id="ulInfoShortcuts"></ul>
            </div>
        </div>

        <div
            id="shortcutModal"
            class="modal hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="shortcutModalTitle"
        >
            <div id="modalContent">
                <h2 id="shortcutModalTitle">Alterar atalho</h2>
                <p id="shortcutModalMessage">Pressione a tecla que deseja atribuir para esta ação.</p>
                <button id="shortcutModalCancel" type="button">Cancelar</button>
            </div>
        </div>
    </body>
</html>
